name: Duplicate Reaction Check

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to check reactions on'
        required: true
        type: number

permissions:
  issues: write
  contents: read

jobs:
  check-reactions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check duplicate reactions
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = parseInt('${{ inputs.issue_number }}');

            // Fetch all comments on the issue
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100
            });

            // Find duplicate detection comment
            const duplicateComment = comments.find(c =>
              c.body && c.body.includes('Potential Duplicate Detected')
            );

            if (!duplicateComment) {
              console.log('No duplicate detection comment found — exiting');
              return;
            }

            // Get reactions on the duplicate detection comment
            const { data: reactions } = await github.rest.reactions.listForIssueComment({
              owner,
              repo,
              comment_id: duplicateComment.id
            });

            const thumbsUp = reactions.filter(r => r.content === '+1');
            const thumbsDown = reactions.filter(r => r.content === '-1');

            console.log(`Thumbs up: ${thumbsUp.length}, Thumbs down: ${thumbsDown.length}`);

            // Remove duplicate label if more thumbs-down than thumbs-up
            if (thumbsDown.length > thumbsUp.length) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: 'duplicate'
                });
              } catch (e) {
                console.log('Label may already be removed:', e.message);
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['pending-triage']
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: '🔄 Duplicate label removed by community reaction — issue re-queued for triage.'
              });

              console.log('Duplicate label removed, issue re-triaged');
            } else {
              console.log('Community confirms duplicate — no action taken');
            }

      - name: Create workflow summary
        if: always()
        run: |
          echo "## Duplicate Reaction Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "Issue #${{ inputs.issue_number }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY