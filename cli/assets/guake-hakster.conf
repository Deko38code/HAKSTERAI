[general]
background-image-file='@BACKDROP@'
compat-delete='delete-sequence'
default-shell='/bin/bash'
display-n=0
display-tab-names=0
gtk-use-system-default-theme=true
hide-tabs-if-one-tab=true
history-size=108000
infinite-history=true
load-guake-yml=true
max-tab-name-length=100
mouse-display=true
open-tab-cwd=true
prompt-on-quit=false
quick-open-command-line='gedit %(file_path)s'
restore-tabs-notify=false
restore-tabs-startup=true
save-tabs-when-changed=true
scroll-keystroke=true
start-at-login=true
use-default-font=false
use-popup=true
use-scrollbar=true
use-trayicon=true
window-halignment=0
window-height=100
window-losefocus=false
window-refocus=false
window-tabbar=true
window-width=100

[style/background]
transparency=90

[style/font]
allow-bold=true
bold-is-bright=true
cell-height-scale=1.0
palette='#000000000000:#afaf42425b5b:#3737a3a31515:#acac5b5b4141:#efc8132e132e:#000000000000:#000000000000:#8464f7761152:#5c5c31312525:#ffff63638787:#2828e5e51f1f:#f0f080806161:#85857979eded:#a0a05d5deeee:#eaeaeaeaeaea:#bfbfa3a3ffff:#8464f7761152:#1b1b1b1b2323'
palette-name='HaksterAI'
style='DejaVu Sans Mono 11'
